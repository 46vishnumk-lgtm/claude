<!--HEAD-->
<title>Castor Showreel Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
/* Layout: a review desk — the film on the left, a timestamped note rail on the right; stacks on phones. */
:root{
  --rv-bg:#EEF2F4;--rv-panel:#FFFFFF;--rv-ink:#0B0F17;--rv-muted:#5B6577;--rv-line:rgba(15,32,58,.12);
  --rv-accent:#D41100;--rv-accent-ink:#FFFFFF;--rv-track:rgba(15,32,58,.12);--rv-chip:#F3F6F8;--rv-focus:#198387;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --rv-bg:#0A0D12;--rv-panel:#121821;--rv-ink:#E9EEF4;--rv-muted:#94A0B2;--rv-line:rgba(233,238,244,.12);
  --rv-accent:#FF4A33;--rv-accent-ink:#0A0D12;--rv-track:rgba(233,238,244,.16);--rv-chip:#1A222D;--rv-focus:#5FD0D4;color-scheme:dark}}
:root[data-theme="dark"]{
  --rv-bg:#0A0D12;--rv-panel:#121821;--rv-ink:#E9EEF4;--rv-muted:#94A0B2;--rv-line:rgba(233,238,244,.12);
  --rv-accent:#FF4A33;--rv-accent-ink:#0A0D12;--rv-track:rgba(233,238,244,.16);--rv-chip:#1A222D;--rv-focus:#5FD0D4;color-scheme:dark}
html,body{height:auto!important;overflow:auto!important;background:var(--rv-bg)!important;color:var(--rv-ink)!important}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#review{max-width:1320px;margin:0 auto;display:grid;gap:18px;font-family:Geist,system-ui,sans-serif}
.rv-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
.rv-head h1{font-size:clamp(20px,2.4vw,26px);font-weight:620;letter-spacing:-.02em;text-wrap:balance;color:var(--rv-ink)}
.rv-head p{font-size:14px;color:var(--rv-muted);max-width:62ch;line-height:1.5}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1060px){.rv-grid{grid-template-columns:minmax(0,1fr)}}
.rv-film{display:grid;gap:12px;min-width:0}
#frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 20px 50px -30px rgba(0,0,0,.45);border:1px solid var(--rv-line)}
#frame #stage{position:absolute;left:0;top:0;border-radius:0;box-shadow:none}
.rv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--rv-panel);border:1px solid var(--rv-line);border-radius:12px;padding:10px 12px}
.rv-btn{height:36px;min-width:36px;padding:0 10px;border-radius:9px;border:1px solid var(--rv-line);background:var(--rv-chip);color:var(--rv-ink);font:500 13px Geist,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.rv-btn svg{width:15px;height:15px}
.rv-btn.primary{background:var(--rv-ink);color:var(--rv-bg);border-color:transparent}
.rv-btn:focus-visible,.rv-chap:focus-visible,#rv-scrub:focus-visible,#rv-text:focus-visible,.rv-note button:focus-visible{outline:2px solid var(--rv-focus);outline-offset:2px}
.rv-time{font:500 14px 'Geist Mono',monospace;font-variant-numeric:tabular-nums;color:var(--rv-ink);white-space:nowrap}
.rv-time span{color:var(--rv-muted)}
.rv-scene{font-size:14px;font-weight:600;color:var(--rv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.rv-speed{display:inline-flex;border:1px solid var(--rv-line);border-radius:9px;overflow:hidden}
.rv-speed button{height:34px;padding:0 9px;border:0;background:var(--rv-chip);color:var(--rv-muted);font:500 12px 'Geist Mono',monospace;cursor:pointer}
.rv-speed button[aria-pressed="true"]{background:var(--rv-ink);color:var(--rv-bg)}
.rv-scrubwrap{position:relative;flex:1 1 100%;height:34px;order:10}
#rv-scrub{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--rv-accent);cursor:pointer;background:transparent}
.rv-marks{position:absolute;left:8px;right:8px;top:0;bottom:0;pointer-events:none}
.rv-marks i{position:absolute;top:2px;width:1px;height:8px;background:var(--rv-muted);opacity:.55}
.rv-marks b{position:absolute;bottom:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--rv-accent)}
.rv-chaps{display:flex;flex-wrap:wrap;gap:6px}
.rv-chap{border:1px solid var(--rv-line);background:var(--rv-panel);color:var(--rv-muted);border-radius:999px;height:32px;padding:0 12px;font:500 13px Geist,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rv-chap em{font-style:normal;font-family:'Geist Mono',monospace;font-size:11px;opacity:.7}
.rv-chap[aria-current="true"]{color:var(--rv-ink);border-color:var(--rv-ink)}
.rv-notes{background:var(--rv-panel);border:1px solid var(--rv-line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.rv-notes h2{font-size:15px;font-weight:620;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--rv-ink)}
.rv-notes h2 span{font:500 12px 'Geist Mono',monospace;color:var(--rv-muted)}
.rv-at{font:500 12px 'Geist Mono',monospace;color:var(--rv-muted);letter-spacing:.04em}
.rv-at b{color:var(--rv-accent);font-weight:600}
#rv-text{width:100%;min-height:92px;resize:vertical;border-radius:10px;border:1px solid var(--rv-line);background:var(--rv-bg);color:var(--rv-ink);padding:10px 12px;font:400 14px/1.45 Geist,system-ui,sans-serif}
.rv-row{display:flex;gap:8px;flex-wrap:wrap}
.rv-row .rv-btn{flex:1}
.rv-status{font-size:12px;color:var(--rv-muted);line-height:1.4;min-height:1.4em}
#rv-list{display:grid;gap:8px;max-height:520px;overflow:auto;list-style:none;padding:0;margin:0}
.rv-note{border:1px solid var(--rv-line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--rv-bg)}
.rv-note header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rv-note .jump{border:0;background:none;padding:0;cursor:pointer;font:600 12px 'Geist Mono',monospace;color:var(--rv-accent);text-align:left}
.rv-note .jump span{color:var(--rv-muted);font-weight:500;margin-left:6px}
.rv-note .del{border:0;background:none;color:var(--rv-muted);cursor:pointer;font-size:12px;padding:2px 4px}
.rv-note p{font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--rv-ink)}
.rv-empty{font-size:13px;color:var(--rv-muted);line-height:1.5;border:1px dashed var(--rv-line);border-radius:10px;padding:12px}
.rv-keys{font-size:12px;color:var(--rv-muted);line-height:1.6}
.rv-keys kbd{font:500 11px 'Geist Mono',monospace;border:1px solid var(--rv-line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--rv-chip);color:var(--rv-ink)}
@media (prefers-reduced-motion:reduce){.rv-btn,.rv-chap{transition:none}}
</style>
<!--TOP-->
<div id="review">
  <header class="rv-head">
    <h1>Castor Showreel Review</h1>
    <p>Scrub to any moment, pause, and pin a note to that exact time. Notes are saved here, and Claude reads them to make the changes.</p>
  </header>
  <div class="rv-grid">
    <section class="rv-film" aria-label="Video">
      <div id="frame">
<!--BOTTOM-->
      </div>
      <div class="rv-bar">
        <button class="rv-btn primary" id="rv-play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path id="rv-play-ic" d="M8 5l11 7-11 7z"/></svg></button>
        <button class="rv-btn" id="rv-back" aria-label="Back one frame step (0.1 seconds)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg></button>
        <button class="rv-btn" id="rv-fwd" aria-label="Forward one frame step (0.1 seconds)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8-6zM4 6v12l8-6z"/></svg></button>
        <div class="rv-time" id="rv-time">00.0<span>s / 46.0s</span></div>
        <div class="rv-scene" id="rv-scene">01 · Opening</div>
        <div class="rv-speed" role="group" aria-label="Playback speed">
          <button data-speed="0.25" aria-pressed="false">¼×</button><button data-speed="0.5" aria-pressed="false">½×</button><button data-speed="1" aria-pressed="true">1×</button>
        </div>
        <div class="rv-scrubwrap"><div class="rv-marks" id="rv-marks"></div><input id="rv-scrub" type="range" min="0" max="4600" value="0" step="1" aria-label="Timeline"></div>
      </div>
      <nav class="rv-chaps" id="rv-chaps" aria-label="Scenes"></nav>
      <p class="rv-keys"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step 0.1s · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> step 1s · <kbd>N</kbd> write a note here</p>
    </section>
    <aside class="rv-notes" aria-label="Change notes">
      <h2>Change notes <span id="rv-count">0</span></h2>
      <div class="rv-at" id="rv-at">Note at <b>00.0s</b> · 01 Opening</div>
      <label for="rv-text" class="rv-at" hidden>Note text</label>
      <textarea id="rv-text" aria-label="Note text" placeholder="What should change at this moment? e.g. make the headline bigger, slow this down, swap this word…"></textarea>
      <div class="rv-row">
        <button class="rv-btn primary" id="rv-add">Pin note here</button>
        <button class="rv-btn" id="rv-copy">Copy all notes</button>
      </div>
      <div class="rv-status" id="rv-status" role="status"></div>
      <ul id="rv-list"></ul>
    </aside>
  </div>
</div>
<!--SCRIPT-->
<script>
(() => {
  const $ = s => document.querySelector(s);
  const frame = $('#frame'), stage = $('#stage');
  const S = window.SHOWREEL, DUR = S.duration, SC = S.scenes;
  let t = 0, playing = false, speed = 1, last = 0;
  const fmt = x => x.toFixed(1).padStart(4, '0');
  const sceneAt = x => { let i = 0; SC.forEach(([s], k) => { if (x >= s) i = k; }); return i; };
  const sceneLabel = i => String(i + 1).padStart(2, '0') + ' · ' + SC[i][1];

  function fit() { stage.style.transform = `scale(${frame.clientWidth / 1920})`; }
  new ResizeObserver(fit).observe(frame); fit();

  // chapters + scene ticks
  const chaps = $('#rv-chaps'), marks = $('#rv-marks');
  SC.forEach(([s, name], i) => {
    const b = document.createElement('button'); b.className = 'rv-chap'; b.type = 'button';
    b.innerHTML = `<em>${String(i + 1).padStart(2, '0')}</em>`; b.append(name);
    b.onclick = () => go(s + .6); chaps.appendChild(b);
    const m = document.createElement('i'); m.style.left = (s / DUR * 100) + '%'; marks.appendChild(m);
  });
  const chapBtns = [...chaps.children];

  const scrub = $('#rv-scrub'), timeEl = $('#rv-time'), sceneEl = $('#rv-scene'), atEl = $('#rv-at');
  function render() {
    S.seek(t);
    scrub.value = Math.round(t * 100);
    const i = sceneAt(t);
    timeEl.innerHTML = `${fmt(t)}<span>s / ${DUR.toFixed(1)}s</span>`;
    sceneEl.textContent = sceneLabel(i);
    atEl.innerHTML = `Note at <b>${fmt(t)}s</b> · ${sceneLabel(i)}`;
    chapBtns.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  }
  function go(x) { t = Math.max(0, Math.min(DUR - .001, x)); render(); }
  function setPlaying(p) { playing = p; $('#rv-play-ic').setAttribute('d', p ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5l11 7-11 7z'); $('#rv-play').setAttribute('aria-label', p ? 'Pause' : 'Play'); last = performance.now(); }
  function loop(now) {
    if (playing) { t += Math.min(.1, (now - last) / 1000) * speed; if (t >= DUR) t = 0; render(); }
    last = now; requestAnimationFrame(loop);
  }
  $('#rv-play').onclick = () => setPlaying(!playing);
  $('#rv-back').onclick = () => { setPlaying(false); go(t - .1); };
  $('#rv-fwd').onclick = () => { setPlaying(false); go(t + .1); };
  scrub.oninput = () => { setPlaying(false); go(scrub.value / 100); };
  document.querySelectorAll('.rv-speed button').forEach(b => b.onclick = () => {
    speed = +b.dataset.speed; document.querySelectorAll('.rv-speed button').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
  });
  addEventListener('keydown', e => {
    if (e.target.closest('textarea,input[type=text]')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setPlaying(false); go(t + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : .1)); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); setPlaying(false); $('#rv-text').focus(); }
  });

  // ---- notes: shared db when available, this browser otherwise ----
  const list = $('#rv-list'), status = $('#rv-status'), text = $('#rv-text');
  let notes = [], db = null;
  const LS = 'castor-review-notes';
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(notes)); } catch {} };
  function drawNotes() {
    $('#rv-count').textContent = notes.length;
    marks.querySelectorAll('b').forEach(b => b.remove());
    list.replaceChildren();
    if (!notes.length) {
      const li = document.createElement('li'); li.className = 'rv-empty';
      li.textContent = 'No notes yet. Pause on a moment you want changed, type what should be different, and press "Pin note at this time".';
      list.appendChild(li); return;
    }
    [...notes].sort((a, b) => a.t - b.t).forEach(n => {
      const li = document.createElement('li'); li.className = 'rv-note';
      const h = document.createElement('header');
      const j = document.createElement('button'); j.className = 'jump'; j.type = 'button';
      j.textContent = fmt(n.t) + 's'; const sp = document.createElement('span'); sp.textContent = n.scene; j.appendChild(sp);
      j.onclick = () => { setPlaying(false); go(n.t); };
      const d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.textContent = 'Remove';
      d.setAttribute('aria-label', 'Remove note at ' + fmt(n.t) + 's');
      d.onclick = () => removeNote(n);
      h.append(j, d);
      const p = document.createElement('p'); p.textContent = n.text;
      li.append(h, p); list.appendChild(li);
      const m = document.createElement('b'); m.style.left = (n.t / DUR * 100) + '%'; marks.appendChild(m);
    });
  }
  async function addNote() {
    const v = text.value.trim();
    if (!v) { status.textContent = 'Type what should change first.'; text.focus(); return; }
    const n = { t: Math.round(t * 10) / 10, scene: sceneLabel(sceneAt(t)), text: v, createdAt: new Date().toISOString() };
    text.value = '';
    if (db) {
      try { await db.collection('notes').add(n); status.textContent = `Pinned at ${fmt(n.t)}s. Claude can read it now.`; }
      catch (e) { notes.push(n); saveLocal(); drawNotes(); status.textContent = 'Saved in this browser only (shared save was refused). Use "Copy all notes" and paste them to Claude.'; }
    } else { notes.push(n); saveLocal(); drawNotes(); status.textContent = `Pinned at ${fmt(n.t)}s in this browser. Use "Copy all notes" to send them to Claude.`; }
  }
  async function removeNote(n) {
    if (db && n.id) { try { await db.collection('notes').doc(n.id).delete(); status.textContent = 'Note removed.'; return; } catch { status.textContent = 'Could not remove that note.'; return; } }
    notes = notes.filter(x => x !== n); saveLocal(); drawNotes(); status.textContent = 'Note removed.';
  }
  $('#rv-add').onclick = addNote;
  text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(); } });
  $('#rv-copy').onclick = async () => {
    const body = [...notes].sort((a, b) => a.t - b.t).map(n => `${fmt(n.t)}s (${n.scene}): ${n.text}`).join('\n') || 'No notes yet.';
    try { await navigator.clipboard.writeText(body); status.textContent = 'Notes copied. Paste them into the chat with Claude.'; }
    catch { text.value = body; text.select(); status.textContent = 'Copy was blocked here. The notes are selected in the box above; copy them from there.'; }
  };

  notes = loadLocal(); drawNotes();
  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (!db) { status.textContent = 'Notes are kept in this browser. Use "Copy all notes" to send them to Claude.'; return; }
    status.textContent = 'Notes are shared: Claude reads them directly.';
    db.collection('notes').orderBy('t').onSnapshot(snap => {
      notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      drawNotes();
    }, () => { status.textContent = 'Could not load shared notes; new notes stay in this browser.'; db = null; notes = loadLocal(); drawNotes(); });
  })();

  const start = () => { go(0); requestAnimationFrame(loop); };
  if (S.ready) start(); else addEventListener('showreel-ready', start, { once: true });
})();
</script>
