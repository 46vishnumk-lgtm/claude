    />
    <meta name="theme-color" content="#0f0f11" />
    <!-- Theme before first paint (see src/lib/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem("arijentek:theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f0f0ee");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
