<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowPilot Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed sidebar rail + scrolling workspace; AI-generated content is always marked in "signal amber". */
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #E8ECF3;
  --ink: #121A2B;
  --ink-2: #4A5468;
  --muted: #747E92;
  --line: #DBE0E9;
  --accent: #2B50D8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FC;
  --ai: #A46A00;
  --ai-soft: #FBF0D9;
  --ai-line: #E9C77E;
  --good: #1D7F55;
  --good-soft: #DDF2E8;
  --warn: #9A6200;
  --warn-soft: #FDF0D5;
  --crit: #BB3A26;
  --crit-soft: #FBE3DE;
  --av1: #2B50D8; --av2: #1D7F55; --av3: #B0447A; --av4: #6B4FC4; --av5: #B5561C; --av6: #2E7C93;
  --shadow: 0 1px 2px rgba(18,26,43,.06), 0 8px 24px rgba(18,26,43,.08);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111C; --surface: #141B2A; --surface-2: #1B2436; --ink: #E8ECF4; --ink-2: #AEB7C9; --muted: #7F899D; --line: #283247;
    --accent: #7D97FF; --accent-ink: #0C111C; --accent-soft: #1C2852;
    --ai: #F0B547; --ai-soft: #32270F; --ai-line: #6E5320;
    --good: #52C792; --good-soft: #13301F; --warn: #E7AA4A; --warn-soft: #33260E; --crit: #F27C66; --crit-soft: #3A1A15;
    --av1: #4F6FE6; --av2: #2C9A6B; --av3: #C45A8F; --av4: #8068D6; --av5: #C46B2F; --av6: #3B93AC;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111C; --surface: #141B2A; --surface-2: #1B2436; --ink: #E8ECF4; --ink-2: #AEB7C9; --muted: #7F899D; --line: #283247;
  --accent: #7D97FF; --accent-ink: #0C111C; --accent-soft: #1C2852;
  --ai: #F0B547; --ai-soft: #32270F; --ai-line: #6E5320;
  --good: #52C792; --good-soft: #13301F; --warn: #E7AA4A; --warn-soft: #33260E; --crit: #F27C66; --crit-soft: #3A1A15;
  --av1: #4F6FE6; --av2: #2C9A6B; --av3: #C45A8F; --av4: #8068D6; --av5: #C46B2F; --av6: #3B93AC;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; stroke: var(--bg); }
.brand b { font: 700 17px var(--f-display); }
.ws { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { margin: 12px 8px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 6px; color: var(--ink-2); text-align: left; font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .count { margin-left: auto; font: 500 11px var(--f-mono); background: var(--surface-2); color: var(--ink-2); padding: 1px 6px; border-radius: 10px; }
.nav .count.ai { background: var(--ai-soft); color: var(--ai); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.me { display: flex; align-items: center; gap: 10px; }
.me small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.main { overflow-y: auto; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.icon-btn.menu-btn { display: none; }
.search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); color: var(--muted); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--ink); }
.search svg { width: 16px; height: 16px; }
.kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.page { padding: 28px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--ink-2); margin-top: 4px; }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ai { background: var(--ai-soft); border-color: var(--ai-line); color: var(--ai); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--ink-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); border: 2px solid var(--bg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-b { padding: 16px 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip.ai { background: var(--ai-soft); color: var(--ai); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.prio i { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.prio i b { width: 3px; border-radius: 1px; background: var(--line); }
.prio i b:nth-child(1) { height: 5px; } .prio i b:nth-child(2) { height: 8px; } .prio i b:nth-child(3) { height: 12px; }
.prio.urgent i b { background: var(--crit); } .prio.high i b:nth-child(-n+3) { background: var(--warn); } .prio.high i b:nth-child(3) { background: var(--line); }
.prio.medium i b:nth-child(-n+2) { background: var(--ink-2); } .prio.medium i b:nth-child(2) { background: var(--ink-2); }
.prio.low i b:nth-child(1) { background: var(--ink-2); }
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font: 600 11px var(--f-body); flex: none; }
.av.lg { width: 36px; height: 36px; font-size: 13px; }
.av.none { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--muted); }
.stack { display: inline-flex; }
.stack .av { border: 2px solid var(--surface); margin-left: -6px; }
.stack .av:first-child { margin-left: 0; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
.ai-mark { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ai); }
.ai-mark svg { width: 14px; height: 14px; }
input.field, select.field, textarea.field { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); min-width: 0; }
input.field:focus, select.field:focus, textarea.field:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
label.lbl { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink-2); min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 500; }
.seg button svg { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click:hover { background: var(--surface-2); cursor: pointer; }
.scroll-x { overflow-x: auto; }
.toggle { position: relative; width: 36px; height: 20px; flex: none; }
.toggle input { appearance: none; margin: 0; width: 36px; height: 20px; border-radius: 10px; background: var(--line); cursor: pointer; transition: background .2s; }
.toggle input:checked { background: var(--accent); }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.toggle input:checked::after { transform: translateX(16px); }
.toggle input:disabled { opacity: .6; cursor: not-allowed; }
.new-pulse { animation: pulse 2.4s ease 2; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 transparent; } 40% { box-shadow: 0 0 0 4px var(--ai-line); } }

/* ---------- dashboard ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 20px; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; } .c6 { grid-column: span 6; } .c3 { grid-column: span 3; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; }
.kpi { padding: 16px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.kpi:last-child { border-right: 0; }
.kpi b { font: 600 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 12px; }
.attention { display: flex; gap: 16px; align-items: center; padding: 16px 18px; background: var(--ai-soft); border: 1px solid var(--ai-line); border-radius: 10px; flex-wrap: wrap; }
.attention .icon-wrap { width: 40px; height: 40px; border-radius: 9px; background: var(--surface); display: grid; place-items: center; color: var(--ai); flex: none; }
.attention .icon-wrap svg { width: 20px; height: 20px; }
.attention .txt { flex: 1; min-width: 220px; }
.attention .txt p { color: var(--ink-2); }
.tlist { display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: 18px minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:last-child { border-bottom: 0; }
.trow:hover { background: var(--surface-2); }
.trow .t { min-width: 0; }
.trow .t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.trow .t small { color: var(--muted); font-size: 12px; }
.check { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 5px; display: grid; place-items: center; background: none; padding: 0; }
.check.on { background: var(--good); border-color: var(--good); }
.check svg { width: 12px; height: 12px; stroke: var(--surface); }
.due { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.due.over { color: var(--crit); font-weight: 500; }
.due.soon { color: var(--warn); font-weight: 500; }
.proj-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
.proj-row:last-child { border-bottom: 0; }
.proj-row:hover { background: var(--surface-2); }
.proj-row .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pdot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 8px; }
.feed { display: flex; flex-direction: column; gap: 14px; }
.feed li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; list-style: none; }
.feed ul { margin: 0; padding: 0; }
.feed small { color: var(--muted); font-size: 12px; }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: grab; }
.card:hover { border-color: var(--muted); }
.card.is-new { border-color: var(--ai-line); }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .title { font-weight: 500; }

/* ---------- meeting flow ---------- */
.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.steps span { display: inline-flex; align-items: center; gap: 6px; }
.steps span.on { color: var(--ink); font-weight: 600; }
.steps span.done { color: var(--good); }
.steps i { width: 18px; height: 1px; background: var(--line); }
.review { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.summary-sec { display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.summary-sec:last-child { border-bottom: 0; }
.summary-sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.cite { font: 500 11px var(--f-mono); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 0 5px; vertical-align: 1px; }
.ai-item { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; transition: opacity .2s; }
.ai-item.off { opacity: .62; }
.ai-item.off .ai-fields { display: none; }
.ai-item.needs { border-color: var(--warn); }
.ai-top { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 12px; padding: 14px 16px 10px; align-items: start; }
.ai-top input[type="checkbox"] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.ai-title { width: 100%; border: 1px solid transparent; background: none; font-weight: 600; font-size: 15px; padding: 2px 6px; margin-left: -6px; border-radius: 5px; }
.ai-title:hover { border-color: var(--line); }
.ai-title:focus { border-color: var(--accent); outline: 0; background: var(--surface); }
.quote { margin: 6px 0 0; padding: 6px 10px; border-left: 2px solid var(--ai-line); color: var(--ink-2); font-size: 13px; background: var(--ai-soft); border-radius: 0 6px 6px 0; }
.quote .mono { color: var(--ai); margin-right: 6px; }
.ai-fields { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; padding: 0 16px 14px 50px; }
.ai-fields .lbl.flag select, .ai-fields .lbl.flag input { border-color: var(--warn); background: var(--warn-soft); }
.hint { font-size: 11px; color: var(--muted); font-weight: 400; }
.hint.warn { color: var(--warn); font-weight: 500; }
.review-foot { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); flex-wrap: wrap; margin-top: 4px; }
.review-foot .grow { flex: 1; min-width: 180px; }
.processing { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 56px 24px; text-align: center; }
.proc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; text-align: left; min-width: 0; max-width: 340px; width: 100%; }
.proc-list li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.proc-list li.done { color: var(--ink); }
.proc-list li.active { color: var(--ai); font-weight: 500; }
.spin { width: 16px; height: 16px; border: 2px solid var(--ai-line); border-top-color: var(--ai); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.proc-list li svg { width: 16px; height: 16px; flex: none; }
.ring { width: 16px; height: 16px; border: 2px solid var(--line); border-radius: 50%; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.success { display: flex; flex-direction: column; gap: 16px; }
.success-h { display: flex; gap: 16px; align-items: center; padding: 20px; flex-wrap: wrap; }
.success-h .big { width: 48px; height: 48px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; flex: none; }
.success-h .big svg { width: 24px; height: 24px; }
.meet-row { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.meet-row:last-child { border-bottom: 0; }
.date-tile { width: 44px; text-align: center; border: 1px solid var(--line); border-radius: 7px; padding: 4px 0; line-height: 1.1; }
.date-tile small { display: block; font: 500 10px var(--f-mono); color: var(--crit); text-transform: uppercase; }
.date-tile b { font: 600 17px var(--f-display); }

/* ---------- assistant ---------- */
.chat { display: grid; grid-template-rows: minmax(0,1fr) auto; height: calc(100vh - 60px); max-height: calc(100% - 0px); }
.chat-scroll { overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 720px; display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; }
.msg.user { margin-left: auto; grid-template-columns: minmax(0,1fr); }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 12px 12px 2px 12px; padding: 10px 14px; justify-self: end; }
.msg .bubble { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ai-av { width: 30px; height: 30px; border-radius: 8px; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; }
.ai-av svg { width: 16px; height: 16px; }
.bubble ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.draft { border: 1px dashed var(--ai-line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.draft .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.composer { padding: 14px 28px 20px; border-top: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; }
.suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); }
.suggest button:hover { border-color: var(--accent); color: var(--accent); }
.composer form { display: flex; gap: 8px; }
.typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); margin-right: 4px; animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- documents ---------- */
.doc-search { display: flex; gap: 8px; }
.doc-search .search { max-width: none; padding: 10px 14px; }
.answer { border: 1px solid var(--ai-line); background: var(--surface); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.sources { display: flex; gap: 8px; flex-wrap: wrap; }
.src { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--ink-2); }
.doc-row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: center; }
.doc-row:last-child { border-bottom: 0; }
.doc-ic { width: 36px; height: 36px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
.doc-ic svg { width: 18px; height: 18px; }
.doc-row p { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: var(--ai-soft); color: var(--ink); border-radius: 2px; padding: 0 1px; }

/* ---------- notifications ---------- */
.notif { display: grid; grid-template-columns: 8px 30px minmax(0,1fr) auto; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: start; }
.notif:last-child { border-bottom: 0; }
.notif .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 10px; }
.notif .read { width: 8px; }
.notif p { color: var(--ink-2); font-size: 13px; }

/* ---------- analytics ---------- */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font: 11px var(--f-mono); }
.chart-wrap .grid-l { stroke: var(--line); stroke-width: 1; }
.chart-wrap .barm { fill: var(--accent); transition: opacity .15s; }
.chart-wrap .barm.last { fill: var(--accent); }
.chart-wrap .barm.dim { opacity: .45; }
.chart-wrap .hit { fill: transparent; cursor: default; }
.chart-wrap .vlabel { fill: var(--ink); font: 600 12px var(--f-body); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); z-index: 3; }
.wl-row { display: grid; grid-template-columns: 130px minmax(0,1fr) 54px; gap: 12px; align-items: center; padding: 6px 0; }
.wl-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.wl-fill { height: 100%; border-radius: 0 3px 3px 0; background: var(--accent); }
.wl-fill.over { background: var(--crit); }
.wl-cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

/* ---------- settings ---------- */
.perm td:not(:first-child), .perm th:not(:first-child) { text-align: center; }
.perm svg { width: 16px; height: 16px; }
.yes { color: var(--good); } .no { color: var(--muted); }
.set-row { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { color: var(--muted); font-size: 13px; max-width: 60ch; }

/* ---------- drawer / modal / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,12,22,.4); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
.drawer-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-b { padding: 18px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.modal { position: fixed; z-index: 21; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(520px, calc(100% - 32px)); background: var(--surface); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100% - 32px); }
.modal .drawer-b { overflow-y: auto; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
.toast { position: fixed; z-index: 30; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 9px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 600; text-decoration: underline; padding: 4px; }

/* ---------- onboarding ---------- */
.onb { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.onb-l { padding: 40px clamp(20px, 5vw, 64px); display: flex; flex-direction: column; gap: 28px; background: var(--surface); }
.onb-r { background: var(--surface-2); padding: 40px clamp(20px, 5vw, 56px); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.onb-progress { display: flex; gap: 6px; }
.onb-progress span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.onb-progress span.on { background: var(--accent); }
.onb-body { display: flex; flex-direction: column; gap: 18px; max-width: 480px; }
.onb-body h1 { font-size: 30px; }
.roles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.role { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.role small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.role[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.conn { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.conn .lg { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font: 700 13px var(--f-display); }
.conn div { flex: 1; min-width: 0; }
.conn small { display: block; color: var(--muted); font-size: 12px; }
.onb-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 480px; }
.preview-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.emails { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .c4, .c5, .c7, .c8, .c6, .c3 { grid-column: span 12; }
  .review { grid-template-columns: minmax(0,1fr); }
  .ai-fields { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 820px) {

  .icon-btn.menu-btn { display: inline-grid; }

  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .kpi:nth-child(2) { border-right: 0; }

  .ai-fields { grid-template-columns: minmax(0,1fr); padding-left: 16px; }
  .onb { grid-template-columns: minmax(0,1fr); }
  .onb-r { display: none; }
  .chat-scroll, .composer { padding-left: 16px; padding-right: 16px; }
  .search .kbd { display: none; }
  .form-grid { grid-template-columns: minmax(0,1fr); }
  .wl-row { grid-template-columns: 90px minmax(0,1fr) 44px; }
  .roles { grid-template-columns: minmax(0,1fr); }
  .trow { grid-template-columns: 18px minmax(0,1fr) auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ================= helpers ================= */
const av = (id, lg) => {
  if (!id) return `<span class="av none${lg ? " lg" : ""}" title="Unassigned">?</span>`;
  if (id === "ai") return `<span class="ai-av" title="FlowPilot">${ic("spark")}</span>`;
  const m = MEMBERS[id];
  const ini = m.name.split(" ").map(w => w[0]).join("");
  return `<span class="av${lg ? " lg" : ""}" style="background:var(${m.c})" title="${esc(m.name)}">${ini}</span>`;
};
const prio = p => `<span class="prio ${p}"><i><b></b><b></b><b></b></i>${PRIOS.find(x => x[0] === p)[1]}</span>`;
const statusChip = s => { const map = { todo: "", doing: "accent", review: "warn", done: "good" }; return `<span class="chip ${map[s]}">${STATUSES.find(x => x[0] === s)[1]}</span>`; };
const progress = pid => { const ts = S.tasks.filter(t => t.project === pid); const d = ts.filter(t => t.status === "done").length; return { total: ts.length, done: d, pct: ts.length ? Math.round(d / ts.length * 100) : 0 }; };
const healthChip = h => `<span class="chip ${h === "On track" ? "good" : h === "At risk" ? "crit" : "warn"}">${h}</span>`;
const unreadCount = () => S.notifications.filter(n => n.unread).length;
const pendingMeetings = () => S.meetings.filter(m => m.status === "new" || m.status === "review").length;
const options = (list, sel, blank) => (blank ? `<option value="">${blank}</option>` : "") + list.map(([v, l]) => `<option value="${v}"${v === sel ? " selected" : ""}>${esc(l)}</option>`).join("");
const memberOpts = sel => options(Object.entries(MEMBERS).map(([k, m]) => [k, m.name]), sel, "Choose owner…");
const projectOpts = sel => options(Object.entries(PROJECTS).map(([k, p]) => [k, p.name]), sel);

function taskRow(t) {
  const done = t.status === "done";
  return `<div class="trow${t.isNew ? " new-pulse" : ""}" data-act="open-task" data-id="${t.id}">
    <button class="check${done ? " on" : ""}" data-act="toggle-done" data-id="${t.id}" aria-label="${done ? "Mark not done" : "Mark done"}">${done ? ic("check") : ""}</button>
    <div class="t"><span style="${done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(t.title)}</span><small><span class="pdot" style="background:var(${PROJECTS[t.project].c})"></span>${PROJECTS[t.project].name}${t.source ? ` · <span style="color:var(--ai)">from ${esc(t.source.meeting)}</span>` : ""}</small></div>
    ${prio(t.priority)}
    ${dueLabel(t.due, done)}
  </div>`;
}

function startProcessing(id) {

  m.status = "processing"; S.procStep = 0; go("meeting");

function createTasks() {
  const m = S.meetings.find(x => x.id === S.meetingId);

    S.tasks.push(t); ids.push(t.id);

  m.status = "done"; m.created = ids.length;
  S.activity.unshift({ who: "ai", text: `created <b>${ids.length} tasks</b> from <b>${esc(m.title)}</b> after your review`, when: "Just now" });
  S.notifications.find(n => n.id === "n1").unread = false;
  S.notifications.unshift({ id: "n" + Date.now(), imp: false, unread: false, who: "ai", title: `${ids.length} tasks created from ${m.title}`, body: "Owners were notified in FlowPilot and Slack.", when: "Just now", go: "project:mobile" });
  toast(`${ids.length} tasks created · owners notified`, "undo-create");

}
function undoCreate() {

  S.lastCreated = [];

/* ================= assistant ================= */
const SUGGEST = ["What’s due this week?", "What’s blocking Mobile App 2.0?", "Create a task to update the FAQ for Tom by Friday", "Who has the most on their plate?", "Summarize Sprint 14 planning"];
function viewAssistant() {
  if (!S.chat.length) S.chat.push({ from: "ai", html: `<p>Hi Maya. I can answer questions about your projects, meetings and docs, or create tasks for you. I always show a draft before changing anything.</p>` });
  return shell(`<div class="chat">
    <div class="chat-scroll" id="chat-scroll" aria-live="polite">
      ${S.chat.map(c => c.from === "user" ? `<div class="msg user"><div class="bubble">${esc(c.text)}</div></div>` : `<div class="msg"><span class="ai-av">${ic("spark")}</span><div class="bubble">${c.html}</div></div>`).join("")}
      ${S.typing ? `<div class="msg"><span class="ai-av">${ic("spark")}</span><div class="bubble typing"><div><span></span><span></span><span></span></div></div></div>` : ""}
    </div>
    <div class="composer">
      <div class="suggest">${SUGGEST.map(s => `<button data-act="ask" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <form data-form="chat"><input class="field" id="chat-input" placeholder="Ask about projects, or say “create a task…”" autocomplete="off"><button class="btn primary" aria-label="Send">${ic("send")}</button></form>
    </div>

}
function ask(q) {
  if (!q.trim()) return;
  S.chat.push({ from: "user", text: q }); S.typing = true; render();
  setTimeout(() => { S.typing = false; S.chat.push({ from: "ai", html: respond(q) }); render(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 700);
}
function respond(q) {
  const s = q.toLowerCase();
  if (/create|add a task|remind/.test(s)) {
    let title = q.replace(/^(please\s+)?(create|add)\s+(a\s+)?task\s+(to\s+)?/i, "").replace(/^remind\s+\w+\s+to\s+/i, "");
    let owner = "";
    for (const [k, m] of Object.entries(MEMBERS)) if (new RegExp("\\b" + m.first + "\\b", "i").test(q)) owner = k;
    let due = "";
    if (/friday|tomorrow/.test(s)) due = "2026-10-02";
    else if (/monday|next week/.test(s)) due = "2026-10-05";
    else if (/today/.test(s)) due = "2026-10-01";
    title = title.replace(/\s+(for|to)\s+\w+(\s+by.*)?$/i, "").replace(/\s+by\s+.*$/i, "").trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);
    const id = "draft" + Date.now();
    S.drafts = S.drafts || {}; S.drafts[id] = { title, owner, due, project: /faq|site|page|copy/.test(s) ? "site" : "mobile", priority: "medium" };
    const d = S.drafts[id];
    return `<p>Here’s a draft. Check it, then create it.</p><div class="draft" data-draft="${id}"><span class="ai-mark">${ic("spark")}Draft task</span><b>${esc(d.title)}</b><div class="row">${av(d.owner)}<span>${d.owner ? MEMBERS[d.owner].name : "No owner"}</span><span class="muted">·</span><span>${d.due ? fmt(d.due) : "No date"}</span><span class="muted">·</span><span>${PROJECTS[d.project].name}</span></div><div class="row"><button class="btn primary sm" data-act="draft-create" data-id="${id}">Create task</button><button class="btn sm" data-act="draft-edit" data-id="${id}">Edit details</button></div></div>`;
  }
  if (/due|this week/.test(s)) {
    const l = S.tasks.filter(t => t.status !== "done" && t.due && daysFrom(t.due) <= 6).sort((a, b) => a.due < b.due ? -1 : 1);
    return `<p><b>${l.length} tasks</b> are due by Wed, Oct 7${l.some(t => daysFrom(t.due) < 0) ? ", and some are already overdue" : ""}:</p><ul>${l.map(t => `<li>${esc(t.title)} · ${MEMBERS[t.assignee].first} · ${dueLabel(t.due)}</li>`).join("")}</ul>`;
  }
  if (/block|risk/.test(s)) return `<p>Two things are blocking <b>Mobile App 2.0</b>:</p><ul><li>The <b>Android 14 upload crash</b>. The beta can’t ship without the fix in Friday’s build. Priya owns it and asked for a Pixel 8 test device. <button class="cite" data-act="open-meeting" data-id="m1">Sprint 14 · 03:40</button></li><li><b>Beta feedback form</b> is 1 day overdue (assigned to you).</li></ul><p class="muted">Suggested next step: confirm a test device for Priya today.</p>`;
  if (/plate|workload|capacity|busiest|most/.test(s)) {
    const counts = Object.keys(MEMBERS).map(k => [k, S.tasks.filter(t => t.assignee === k && t.status !== "done").length]).sort((a, b) => b[1] - a[1]);
    return `<p><b>${MEMBERS[counts[0][0]].name}</b> has the most open work (${counts[0][1]} tasks). Team capacity is set at 5 open tasks per person.</p><ul>${counts.map(([k, n]) => `<li>${MEMBERS[k].name}: ${n}${n > 5 ? " · over capacity" : ""}</li>`).join("")}</ul>`;
  }
  if (/sprint|summar|meeting/.test(s)) { const m = S.meetings[0]; return `<p>${esc(m.summary.overview)}</p><p class="muted">${m.status === "done" ? `${m.created} tasks were created from it.` : `${m.items.length} action items are waiting for review.`}</p><div><button class="btn sm" data-act="open-meeting" data-id="m1">Open meeting</button></div>`; }
  const hits = S.tasks.filter(t => s.split(/\W+/).some(w => w.length > 3 && t.title.toLowerCase().includes(w)));
  if (hits.length) return `<p>I found ${hits.length} related task${hits.length > 1 ? "s" : ""}:</p><ul>${hits.slice(0, 5).map(t => `<li>${esc(t.title)} · ${PROJECTS[t.project].name}</li>`).join("")}</ul>`;
  return `<p>I couldn’t find anything about that in your projects or docs. Try asking about a project, a person, a deadline, or say “create a task to…”.</p>`;
}

  return shell(`<div class="page">

const WEEKS = [["Aug 10", 18], ["Aug 17", 22], ["Aug 24", 19], ["Aug 31", 25], ["Sep 7", 21], ["Sep 14", 27], ["Sep 21", 24], ["Sep 28", 31]];
function barChart() {
  const W = 560, H = 220, pl = 32, pb = 26, pt = 18, max = 35;
  const bw = (W - pl) / WEEKS.length;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = "";
  [0, 10, 20, 30].forEach(v => { g += `<line class="grid-l" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  WEEKS.forEach(([l, v], i) => {
    const x = pl + i * bw + bw * 0.22, w = bw * 0.56, top = y(v), base = y(0);
    const last = i === WEEKS.length - 1;
    g += `<path class="barm${last ? " last" : " dim"}" d="M${x},${base} V${top + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${base} z"/>`;
    g += `<text class="axis" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${l}</text>`;
    if (last) g += `<text class="vlabel" x="${x + w / 2}" y="${top - 6}" text-anchor="middle">${v}</text>`;
    g += `<rect class="hit" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" data-tip="Week of ${l}: ${v} tasks completed"/>`;
  });
  return `<div class="chart-wrap" id="chart1"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per week, from 18 in the week of Aug 10 to 31 in the week of Sep 28">${g}</svg><div class="tip" hidden></div></div>`;
}
function viewAnalytics() {
  const cap = 5;
  const wl = Object.keys(MEMBERS).map(k => [k, S.tasks.filter(t => t.assignee === k && t.status !== "done").length]).sort((a, b) => b[1] - a[1]);
  const maxWl = Math.max(8, ...wl.map(x => x[1]));
  const fromMeet = S.tasks.filter(t => t.source).length;
  return shell(`<div class="page">
    <div class="page-head"><div><h1>Analytics</h1><p>Last 8 weeks · all projects · example data</p></div><div class="seg" role="group" aria-label="Range"><button aria-pressed="false">4 weeks</button><button aria-pressed="true">8 weeks</button><button aria-pressed="false">Quarter</button></div></div>
    <section class="panel kpis">
      <div class="kpi"><span class="eyebrow">Completed</span><b>187</b><span class="delta" style="color:var(--good)">↑ 14% vs. prior 8 weeks</span></div>
      <div class="kpi"><span class="eyebrow">Median cycle time</span><b>3.4 d</b><span class="delta" style="color:var(--good)">↓ 0.6 d</span></div>
      <div class="kpi"><span class="eyebrow">On-time rate</span><b>82%</b><span class="delta muted">target 85%</span></div>
      <div class="kpi"><span class="eyebrow">Meeting → tasks</span><b>4 min</b><span class="delta muted">median, ${fromMeet + 7} tasks from meetings</span></div>
    </section>
    <div class="grid">
      <section class="panel c7"><div class="panel-h"><h2>Tasks completed per week</h2><span class="muted" style="font-size:12px">Hover a bar for detail</span></div><div class="panel-b">${barChart()}</div></section>
      <section class="panel c5"><div class="panel-h"><h2>Open tasks per person</h2><span class="muted" style="font-size:12px">line = capacity (${cap})</span></div><div class="panel-b">
        ${wl.map(([k, n]) => `<div class="wl-row"><span style="display:flex;gap:8px;align-items:center;min-width:0">${av(k)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${MEMBERS[k].first}</span></span><div class="wl-track" title="${MEMBERS[k].name}: ${n} open tasks"><div class="wl-fill${n > cap ? " over" : ""}" style="width:${n / maxWl * 100}%"></div><span class="wl-cap" style="left:${cap / maxWl * 100}%"></span></div><span class="num" style="text-align:right">${n}${n > cap ? ` <span style="color:var(--crit)" title="Over capacity">${ic("alert").replace("<svg", '<svg width="13" height="13"')}</span>` : ""}</span></div>`).join("")}
      </div></section>
      <section class="panel c12 scroll-x"><table class="tbl"><thead><tr><th>Project</th><th>Health</th><th>Progress</th><th>Overdue</th><th>From meetings</th><th>Target</th></tr></thead><tbody>
        ${Object.entries(PROJECTS).map(([k, p]) => { const pr = progress(k); const od = S.tasks.filter(t => t.project === k && t.status !== "done" && t.due && daysFrom(t.due) < 0).length; return `<tr class="click" data-act="open-project" data-id="${k}"><td><b>${p.name}</b></td><td>${healthChip(p.health)}</td><td class="num">${pr.pct}%</td><td class="num" style="color:${od ? "var(--crit)" : "inherit"}">${od}</td><td class="num">${S.tasks.filter(t => t.project === k && t.source).length}</td><td class="num">${fmt(p.due)}</td></tr>`; }).join("")}
      </tbody></table></section>
    </div>
  </div>`);
}

let toastTimer;

/* ================= render & routing ================= */
const VIEWS = { onboarding: viewOnboarding, dashboard: viewDashboard, assistant: viewAssistant, projects: viewProjects, project: viewProject, tasks: viewTasks, meetings: viewMeetings, meeting: viewMeeting, documents: viewDocuments, notifications: viewNotifications, analytics: viewAnalytics, settings: viewSettings };
const root = document.getElementById("root"), layer = document.getElementById("layer");
function render() {
  const main = document.getElementById("main");
  const scroll = main ? main.scrollTop : 0;
  root.innerHTML = VIEWS[S.view]();
  const m2 = document.getElementById("main");
  if (m2 && S._keepScroll) m2.scrollTop = scroll;
  S._keepScroll = false;
  const cs = document.getElementById("chat-scroll"); if (cs) cs.scrollTop = cs.scrollHeight;
  bindChart();
  renderLayer();
}
function renderLayer() { layer.innerHTML = overlay(); }
function go(v) { S.view = v; S.menuOpen = false; S.drawer = null; render(); const m = document.getElementById("main"); if (m) m.scrollTop = 0; }
function rerenderKeep() { S._keepScroll = true; render(); }

function bindChart() {
  const wrap = document.getElementById("chart1"); if (!wrap) return;
  const tip = wrap.querySelector(".tip"), bars = wrap.querySelectorAll(".barm");
  wrap.querySelectorAll(".hit").forEach((r, i) => {
    r.addEventListener("mouseenter", () => { tip.hidden = false; tip.textContent = r.dataset.tip; bars.forEach((b, j) => b.style.opacity = j === i ? 1 : .35); });
    r.addEventListener("mousemove", e => { const b = wrap.getBoundingClientRect(); tip.style.left = (e.clientX - b.left) + "px"; tip.style.top = (e.clientY - b.top) + "px"; });
    r.addEventListener("mouseleave", () => { tip.hidden = true; bars.forEach(b => b.style.opacity = ""); });
  });
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === "INPUT" || el.tagName === "SELECT") return; // handled by change
  switch (a) {
    case "go": go(el.dataset.view); break;
    case "menu": S.menuOpen = !S.menuOpen; rerenderKeep(); break;
    case "restart": S.onbStep = 0; go("onboarding"); break;
    case "onb-next": readOnb(); if (S.onbStep < 3) { S.onbStep++; render(); } else { go("dashboard"); toast(`Welcome to ${S.workspace}. ${S.invites.length} invites sent.`); } break;
    case "onb-back": readOnb(); S.onbStep--; render(); break;
    case "onb-skip": go("dashboard"); break;
    case "role": S.role = el.dataset.role; render(); break;
    case "rm-invite": S.invites.splice(+el.dataset.i, 1); render(); break;
    case "open-project": S.projectId = id; go("project"); break;
    case "pmode": S.projectsMode = el.dataset.mode; render(); break;
    case "open-task": S.drawer = id; renderLayer(); break;
    case "toggle-done": { e.stopPropagation(); const t = S.tasks.find(x => x.id === id); t.status = t.status === "done" ? "todo" : "done"; if (t.status === "done") toast(`Completed “${t.title}”`); rerenderKeep(); break; }
    case "close": S.drawer = null; S.modal = null; rerenderKeep(); break;
    case "new-task": S.modal = {}; renderLayer(); setTimeout(() => document.getElementById("nt-title")?.focus(), 0); break;
    case "tfilter": S.taskFilter = el.dataset.f; render(); break;
    case "open-meeting": S.menuOpen = false; startProcessing(id); break;
    case "create-tasks": createTasks(); break;
    case "undo-create": undoCreate(); break;
    case "cite": toast(`Transcript opened at ${el.dataset.ts}`); break;
    case "regen": { const p = document.getElementById("overview"); if (p) p.textContent = "Beta to 50 testers on Oct 14 if the Android crash fix lands Friday. Dark mode moves to 2.1."; break; }
    case "ask": ask(el.dataset.q); break;
    case "draft-create": { const d = S.drafts[id]; const t = T(d.title, d.project, d.owner, d.priority, "todo", d.due); S.tasks.push(t); S.chat.push({ from: "ai", html: `<p>Created <b>${esc(t.title)}</b>${d.owner ? ` and notified ${MEMBERS[d.owner].first}` : ""}. <button class="cite" data-act="open-task" data-id="${t.id}">Open task</button></p>` }); el.closest(".draft").querySelector(".row:last-child").innerHTML = '<span class="chip good">Created</span>'; render(); break; }
    case "draft-edit": S.modal = { draft: S.drafts[id] }; renderLayer(); break;
    case "docq": S.docQuery = el.dataset.q; render(); break;
    case "ntab": S.notifTab = el.dataset.k; render(); break;
    case "read-all": S.notifications.forEach(n => n.unread = false); render(); toast("All notifications marked as read"); break;
    case "notif-go": { const n = S.notifications.find(x => x.id === id); n.unread = false; const [kind, arg] = n.go.split(":"); if (kind === "meeting") startProcessing(arg); else if (kind === "project") { S.projectId = arg; go("project"); } else go(kind); break; }
    case "stab": S.settingsTab = el.dataset.k; render(); break;
    case "toast": toast(el.dataset.msg); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "ai-toggle") { const m = S.meetings.find(x => x.id === S.meetingId); m.items[+el.dataset.i].on = el.checked; rerenderKeep(); return; }
  if (el.dataset.act === "conn") { S.connections[el.dataset.k] = el.checked; return; }
  if (el.dataset.act === "role-change") { MEMBERS[el.dataset.k].role = el.value; toast(`${MEMBERS[el.dataset.k].first} is now ${el.value === "Admin" ? "an" : "a"} ${el.value}`); return; }
  if (el.dataset.field) { updateItem(el); rerenderKeep(); setTimeout(() => document.getElementById(el.id)?.focus(), 0); return; }
  if (el.dataset.tfield) { const t = S.tasks.find(x => x.id === S.drawer); t[el.dataset.tfield] = el.value; rerenderKeep(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.field === "title") updateItem(el);
  if (el.dataset.tfield === "title") { const t = S.tasks.find(x => x.id === S.drawer); t.title = el.value; }
});
function updateItem(el) {
  const m = S.meetings.find(x => x.id === S.meetingId); const it = m.items[+el.dataset.i];
  it[el.dataset.field] = el.value;
  if (el.dataset.field === "owner") it.ownerConf = "high";

document.addEventListener("submit", e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === "chat") { const i = document.getElementById("chat-input"); const q = i.value; i.value = ""; ask(q); }

    const t = T(fd.get("title"), fd.get("project"), fd.get("owner"), fd.get("priority"), "todo", fd.get("due"));

    toast(`Created “${t.title}”${t.assignee ? ` · ${MEMBERS[t.assignee].first} notified` : ""}`);

});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (S.drawer || S.modal || S.menuOpen)) { S.drawer = null; S.modal = null; S.menuOpen = false; rerenderKeep(); }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { const s = document.getElementById("global-search"); if (s) { e.preventDefault(); s.focus(); } }
  if (e.key === "Enter" && e.target.id === "global-search") { const q = e.target.value; e.target.value = ""; go("assistant"); ask(q); }
  if (e.key === "Enter" && e.target.classList?.contains("card")) { S.drawer = e.target.dataset.id; renderLayer(); }
});
function readOnb() {
  const w = document.getElementById("onb-ws"); if (w && w.value.trim()) S.workspace = w.value.trim();
  const s = document.getElementById("onb-size"); if (s) S.teamSize = s.value;
}
/* drag & drop on boards */
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (c) e.dataTransfer.setData("text/plain", c.dataset.drag); });
document.addEventListener("dragover", e => { const col = e.target.closest?.("[data-drop]"); if (col) { e.preventDefault(); col.classList.add("over"); } });
document.addEventListener("dragleave", e => { const col = e.target.closest?.("[data-drop]"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.("[data-drop]"); if (!col) return; e.preventDefault();
  const t = S.tasks.find(x => x.id === e.dataTransfer.getData("text/plain")); if (!t) return;
  t.status = col.dataset.drop; toast(`Moved to ${STATUSES.find(s => s[0] === t.status)[1]}`); rerenderKeep();
});

/* deep links: #dashboard, #meeting, #projects … */
const h = location.hash.replace("#", "");
if (h === "meeting" || h === "flow") { S.view = "dashboard"; render(); startProcessing("m1"); }
else if (VIEWS[h] && h !== "project") { S.view = h; render(); }
else render();
})();
</script>
</body>
</html>
